[package]
name = "datapilot-scout"
version = "1.0.1"
description = "Datapilot Scout - Digital Forensics Investigation Tool"
authors = ["Datapilot"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "datapilot_scout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
jwalk = "0.8"
memmap2 = "0.9"
image = "0.25"
uuid = { version = "1.7", features = ["v4", "serde"] }
rayon = "1.8"
rusqlite = { version = "0.32", features = ["bundled"] }
plist = "1.6"
printpdf = "0.7"
dirs = "5.0"
evtx = "0.8"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
bcrypt = "0.15"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
pbkdf2 = "0.12"
hex = "0.4"
base64 = "0.22"
urlencoding = "2.1"
tar = "0.4"
flate2 = "1.0"
crossbeam-channel = "0.5"
bloomfilter = "1.0"
wmi = "0.14"
ureq = "2.9"

# Warrant Triage (search-warrant return parsers — Meta MVP, more providers TBD)
scraper = "0.20"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["fileapi", "winbase", "minwindef", "winnt"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "user"] }
libc = "0.2"
# For offline Windows registry parsing on Linux
nt_hive2 = "4.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[features]
# Demo/trial mode feature flag
demo = []
# Portable USB build — USB serial machine ID, no Android/iOS, reports next to exe
portable = []
# Diagnostic build — writes Scout-Diagnostic-Log.txt to Desktop with verbose SMS pipeline telemetry
diag = []
default = ["demo"]

